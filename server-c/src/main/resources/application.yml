spring:
  application:
    name: server-c
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/server_c?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:promotion}
    password: ${DB_PASSWORD:promotion}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # ADR-003: 발급은 Kafka consumer 안의 비관적 락 트랜잭션. concurrency 1~2 + max-poll-records 10~50
      # 기준이라 동시 connection 수요는 작음. redeem API 대비 헤드룸 포함 pool 10.
      maximum-pool-size: ${HIKARI_POOL_SIZE:10}
      connection-timeout: 3000
      validation-timeout: 1000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:29092}
    admin:
      operation-timeout: 5s
      fail-fast: false
    # ADR-002: at-least-once outbox publish + idempotent producer.
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 30000
        request.timeout.ms: 5000
        linger.ms: 5
      retries: 5
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: coupon-issue-server-c
      auto-offset-reset: earliest
      enable-auto-commit: false
      isolation-level: read_committed
      # ADR-009: 1 vCPU MySQL-C 의 비관적 락 처리량을 보호하기 위한 throttle.
      max-poll-records: 10
      properties:
        max.poll.interval.ms: 300000
        session.timeout.ms: 45000
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: RECORD
      type: SINGLE
      # ADR-009: 단일 consumer 가 partition 을 처리. 처리량 < partition 1 개 단위.
      concurrency: 1

server:
  port: 8082
  shutdown: graceful
  tomcat:
    mbeanregistry:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  pattern:
    level: "%5p"
  level:
    root: INFO
    com.promotion: INFO

app:
  kafka:
    topic:
      issue-request: ${KAFKA_TOPIC_ISSUE_REQUEST:coupon-issue-request}
      issue-result: ${KAFKA_TOPIC_ISSUE_RESULT:coupon-issue-result}
      partitions: ${KAFKA_TOPIC_PARTITIONS:3}
      replication-factor: ${KAFKA_TOPIC_RF:1}
    send-timeout-ms: ${KAFKA_SEND_TIMEOUT_MS:3000}
    consumer:
      concurrency: ${KAFKA_CONSUMER_CONCURRENCY:1}
  outbox:
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:500}
    batch-size: ${OUTBOX_BATCH_SIZE:50}
