services:
  # ADR-006 Database per Service. Server A 와 Server C 는 각자 독립 MySQL 인스턴스.
  # Server B 는 Redis only (MySQL 없음).
  # 호스트 포트는 3306 (mysql-a) / 3307 (mysql-c) — 충돌 회피. 컨테이너 내부는 모두 3306.
  mysql-a:
    image: mysql:8.0
    container_name: promotion-mysql-a
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: promotion
      MYSQL_PASSWORD: promotion
      # 단일 schema 만 자동 생성 — 사용자 promotion 에 자동 권한 부여.
      MYSQL_DATABASE: server_a
    ports:
      - "3306:3306"
    volumes:
      - mysql_a_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - promotion-net

  mysql-c:
    image: mysql:8.0
    container_name: promotion-mysql-c
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: promotion
      MYSQL_PASSWORD: promotion
      MYSQL_DATABASE: server_c
    ports:
      - "3307:3306"
    volumes:
      - mysql_c_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - promotion-net

  redis:
    image: redis:7-alpine
    container_name: promotion-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - promotion-net

  kafka:
    image: apache/kafka:3.7.0
    container_name: promotion-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - promotion-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: promotion-kafka-ui
    ports:
      # 호스트 포트 8081 은 server-b 가 점유 (A→B sync 호출 endpoint). Kafka UI 는 8085.
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - promotion-net

  # ─────────────────────────────────────────────────────────────────────
  # 관측성 — Day 4 부하 측정용 (PR #20).
  # 측정 도구이므로 측정 대상 (server-a/b/c) 의 1 vCPU 자원을 빼앗지 않도록
  # 자원 제약 없이 호스트 자원 사용. retention 2h — Phase B 1회 측정 + 보고서 캡처에 충분.
  # ─────────────────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: promotion-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Phase B 측정 → 보고서 작성 → 재측정 사이클 흡수 (5s scrape × 24h ≈ 수백 MB 부피).
      - --storage.tsdb.retention.time=24h
      - --storage.tsdb.retention.size=512MB
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - promotion-net

  grafana:
    image: grafana/grafana:11.2.0
    container_name: promotion-grafana
    ports:
      - "3000:3000"
    environment:
      # local 평가용 기본값. 운영 진입 시 .env / Secret Manager 로 분리 (scope-decisions §4).
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/provisioning/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q ok || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - promotion-net

  # ─────────────────────────────────────────────────────────────────────
  # 애플리케이션 서비스 — 평가 5축 ⑤ (사이징) 의 전제 조건인 1 vCPU / 2 GB 자원 제약을
  # 컨테이너 단위로 강제 (CLAUDE.md §2). 동일 호스트에서 부하를 측정해도 각 서비스가
  # cpus=1 + mem=2g 이하만 사용하므로 측정 결과가 평가 시나리오와 정합.
  #
  # JVM: -XX:+UseContainerSupport (Java 21 default true) + MaxRAMPercentage=70 →
  #      heap ~1.4 GB + OS/native ~600 MB. G1GC 로 1 vCPU 환경의 latency 안정화.
  # 빌드: 호스트에서 ./gradlew :server-X:bootJar 후 docker compose up.
  # ─────────────────────────────────────────────────────────────────────

  server-a:
    build:
      context: .
      dockerfile: server-a/Dockerfile
    image: promotion-server-a:local
    container_name: promotion-server-a
    cpus: 1.0
    mem_limit: 2g
    mem_reservation: 1g
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql-a
      DB_PORT: 3306
      SERVER_B_URL: http://server-b:8081
      HIKARI_POOL_SIZE: ${HIKARI_POOL_SIZE_A:-20}
    depends_on:
      mysql-a:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 30s
    networks:
      - promotion-net

  server-b:
    build:
      context: .
      dockerfile: server-b/Dockerfile
    image: promotion-server-b:local
    container_name: promotion-server-b
    cpus: 1.0
    mem_limit: 2g
    mem_reservation: 1g
    ports:
      - "8081:8081"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP: kafka:9092
      SERVER_C_URL: http://server-c:8082
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 30s
    networks:
      - promotion-net

  server-c:
    build:
      context: .
      dockerfile: server-c/Dockerfile
    image: promotion-server-c:local
    container_name: promotion-server-c
    cpus: 1.0
    mem_limit: 2g
    mem_reservation: 1g
    ports:
      - "8082:8082"
    environment:
      DB_HOST: mysql-c
      DB_PORT: 3306
      KAFKA_BOOTSTRAP: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      EVENT_CACHE_TTL_SECONDS: ${EVENT_CACHE_TTL_SECONDS:-300}
      EVENT_CACHE_REFRESH_MS: ${EVENT_CACHE_REFRESH_MS:-60000}
    depends_on:
      mysql-c:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 30s
    networks:
      - promotion-net

volumes:
  mysql_a_data:
  mysql_c_data:
  redis_data:
  kafka_data:
  prometheus_data:
  grafana_data:

networks:
  promotion-net:
    driver: bridge
