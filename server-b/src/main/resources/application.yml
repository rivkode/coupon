spring:
  application:
    name: server-b
  threads:
    virtual:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 1000ms
      connect-timeout: 1000ms
      lettuce:
        pool:
          enabled: true
          max-active: 24
          max-idle: 12
          min-idle: 4
          max-wait: 500ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:29092}
    admin:
      operation-timeout: 5s
      fail-fast: false
    # ADR-008: idempotent producer + acks=all + retries.
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 30000
        request.timeout.ms: 5000
        linger.ms: 5
        compression.type: lz4
      retries: 5
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    # ADR-009: C → B 의 result topic consumer. Redis HSET 처리만 하므로 max-poll 보수적.
    consumer:
      group-id: coupon-result-server-b
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 50
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: RECORD
      type: SINGLE
      concurrency: 1

server:
  port: 8081
  shutdown: graceful
  tomcat:
    mbeanregistry:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  pattern:
    level: "%5p"
  level:
    root: INFO
    com.promotion: INFO
    org.springframework.web: INFO

app:
  redis:
    pending-ttl-seconds: ${PENDING_TTL_SECONDS:86400}
  kafka:
    topic:
      issue-request: ${KAFKA_TOPIC_ISSUE_REQUEST:coupon-issue-request}
      issue-result: ${KAFKA_TOPIC_ISSUE_RESULT:coupon-issue-result}
      partitions: ${KAFKA_TOPIC_PARTITIONS:3}
      replication-factor: ${KAFKA_TOPIC_RF:1}
    send-timeout-ms: ${KAFKA_SEND_TIMEOUT_MS:3000}
    # ADR-008 스케줄러 재발행용 별도 timeout — 기본 3s 가 fixed-delay 1s 와 batch 50 과 결합되면 cycle 폭주.
    scheduler-send-timeout-ms: ${KAFKA_SCHEDULER_SEND_TIMEOUT_MS:500}
  scheduler:
    # ADR-008: 10 초 이상 pending → C 조회 → (없으면) Kafka 재발행 → cap 초과시 FAILED.
    pending-cutoff-seconds: ${SCHEDULER_PENDING_CUTOFF_SECONDS:10}
    fixed-delay-ms: ${SCHEDULER_FIXED_DELAY_MS:1000}
    batch-size: ${SCHEDULER_BATCH_SIZE:50}
    # 최초 accept 시 1, 스케줄러 재발행마다 +1. cutoff(10s) × max(3) = 30s 안에 결론.
    max-publish-attempts: ${SCHEDULER_MAX_PUBLISH_ATTEMPTS:3}
  server-c:
    # 스케줄러가 C 의 internal GET 을 호출할 때 사용.
    base-url: ${SERVER_C_URL:http://localhost:8082}
    timeout-ms: ${SERVER_C_TIMEOUT_MS:1500}
