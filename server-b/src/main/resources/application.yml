spring:
  application:
    name: server-b
  datasource:
    # server_b 는 Outbox 보조 RDBMS (CLAUDE.md ADR-002, ADR-006).
    # 재고 권위는 Redis (ADR-003) — 본 DB 는 Outbox 적재 / poller 만 사용.
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/server_b?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:promotion}
    password: ${DB_PASSWORD:promotion}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 1 vCPU 환경 보수적 설정. Outbox 는 INSERT 위주라 풀 작게 유지.
      # Day 4 k6 부하 테스트 결과에 따라 튜닝.
      maximum-pool-size: 8
      connection-timeout: 3000
      validation-timeout: 1000
  jpa:
    hibernate:
      # Flyway 가 스키마 진실 — JPA 는 검증만.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 1000ms
      connect-timeout: 1000ms
      lettuce:
        pool:
          enabled: true
          # Lua 발급(PR #9) 호출량을 흡수할 수 있는 풀. server-a 보다 약간 크게.
          max-active: 24
          max-idle: 12
          min-idle: 4
          max-wait: 500ms
  # Kafka producer (Outbox poller 가 사용). docker-compose 의 host listener (29092).
  # ADR-002: Outbox + at-least-once 발행 + Consumer 멱등성 = 의미적 exactly-once.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:29092}
    # KafkaAdmin 이 부팅 시 NewTopic 빈 처리. broker 가 없을 때 default 30s 대기 → 짧게.
    admin:
      operation-timeout: 5s
      fail-fast: false
    producer:
      # 정합성 우선 — leader + ISR 모두 ack. broker 1 대 환경에선 leader 만이지만 정책 명시.
      acks: all
      # broker 측 dedup 으로 retry 시 중복 발행 차단 (idempotent producer).
      # max.in.flight=5 까지 호환 (Kafka 2.0+).
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 30000
        request.timeout.ms: 5000
        linger.ms: 5
        compression.type: lz4
      retries: 5
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  # A→B sync 호출 (ADR-001) 의 endpoint. server-a 의 app.server-b.base-url 과 정합.
  port: 8081
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p"
  level:
    root: INFO
    com.promotion: INFO
    org.springframework.web: INFO

# 발급 정책 값. ADR 기반 기본값 + 환경변수 override.
app:
  coupon-issue:
    # idempotency 캐시 + coupon hash TTL.
    # 24h 이면 server-a IdempotencyFilter (24h, ADR-004) 와 정합 — 같은 키가 양쪽에서 동시 만료.
    ttl-seconds: ${COUPON_ISSUE_TTL_SECONDS:86400}
    # CouponCode 충돌 (확률 ~ 0) 발생 시 새 코드로 재시도 횟수.
    code-collision-max-retries: ${COUPON_CODE_COLLISION_MAX_RETRIES:3}
  # Outbox poller (CLAUDE.md ADR-002). 단일 인스턴스 운영 가정 + SKIP LOCKED 안전망.
  outbox:
    poller:
      # 발행 cycle 간격. 200ms 면 server-a → server-b sync (200ms timeout) 와 정합 —
      # 사용자 응답 직후 평균 1 cycle 안에 Kafka 발행 완료.
      fixed-delay-ms: ${OUTBOX_POLLER_FIXED_DELAY_MS:200}
      # cycle 당 batch 크기. 너무 크면 한 트랜잭션이 길어짐.
      batch-size: ${OUTBOX_POLLER_BATCH_SIZE:100}
      # 부팅 직후 첫 cycle 까지의 지연. health 가 안정된 뒤 첫 발행 — DB / Redis connection
      # warmup 완료 후 cycle 시작. IT 가 본 값을 1시간으로 override 하여 자동 cycle 비활성화.
      initial-delay-ms: ${OUTBOX_POLLER_INITIAL_DELAY_MS:5000}
      # 발행 1건 timeout — KafkaTemplate.send().get(timeout). request.timeout.ms 보다 짧게.
      send-timeout-ms: ${OUTBOX_POLLER_SEND_TIMEOUT_MS:3000}
  kafka:
    topic:
      # ADR-002 의 발행 topic. partitions=3 (단일 broker 환경 + userId key 분산),
      # replication factor=1 (KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 정합).
      coupon-issued: ${KAFKA_TOPIC_COUPON_ISSUED:coupon.issued}
      coupon-issued-partitions: ${KAFKA_TOPIC_COUPON_ISSUED_PARTITIONS:3}
      coupon-issued-replication-factor: ${KAFKA_TOPIC_COUPON_ISSUED_RF:1}
