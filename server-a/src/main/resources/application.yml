spring:
  application:
    name: server-a
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/server_a?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:promotion}
    password: ${DB_PASSWORD:promotion}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # ADR-010: per-request commit (batch insert 미사용). 신규 흐름은 응답이 즉시 "접수 완료" 라
      # latency 가 짧음 → 별도 큐 불필요. 1 vCPU MySQL-A 의 commit 처리량은 측정 후 결정.
      # 1 vCPU 환경에서 너무 큰 pool 은 context switching 비용으로 한계 효용이 떨어진다.
      # 측정 결과 (docs/reports/load-test-bottleneck-analysis.md) — pool=10 은 동시성 부족,
      # pool=50 은 server-b 가 다음 병목 → pool=20 이 헤드룸 + 효율의 균형점.
      maximum-pool-size: ${HIKARI_POOL_SIZE:20}
      connection-timeout: 3000
      validation-timeout: 1000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration

server:
  port: 8080
  shutdown: graceful
  tomcat:
    mbeanregistry:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus, circuitbreakers
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  pattern:
    level: "%5p"
  level:
    root: INFO
    com.promotion: INFO
    org.springframework.web: INFO

app:
  server-b:
    base-url: ${SERVER_B_URL:http://localhost:8081}
    connect-timeout-millis: 1000
    # ADR-001: B 는 Redis 적재 + Kafka publish 후 즉시 응답.
    # 측정 결과 500ms 는 1000 TPS 부하에서 slow-call 로 분류되어 CB 가 false-positive OPEN.
    # 응답 모델이 "접수 완료" 라 1s latency 허용 (docs/reports/load-test-bottleneck-analysis.md).
    read-timeout-millis: 1000

# ADR-001: A→B 호출 보호. Circuit Breaker 만 사용 (Bucket4j / Bulkhead 미사용).
resilience4j:
  circuitbreaker:
    instances:
      couponIssuing:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-rate-threshold: 50
        slow-call-duration-threshold: 500ms
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
