spring:
  application:
    name: server-a
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/server_a?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:promotion}
    password: ${DB_PASSWORD:promotion}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 1 vCPU 환경 보수적 설정. Day 4 k6 부하 테스트 결과에 따라 튜닝.
      maximum-pool-size: 10
      connection-timeout: 3000
      validation-timeout: 1000
  jpa:
    hibernate:
      # Flyway 가 스키마 진실 — JPA 는 검증만.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 1000ms
      connect-timeout: 1000ms
      lettuce:
        pool:
          enabled: true
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 500ms

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus, circuitbreakers, ratelimiters
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

logging:
  pattern:
    # traceId / spanId 는 Day 1 단계에선 MDC 미주입 (Phase 7 이후 보강).
    level: "%5p"
  level:
    root: INFO
    com.promotion: INFO
    org.springframework.web: INFO

# 애플리케이션 정책 값. ADR 기반 기본값 + 환경변수 override.
app:
  server-b:
    # Phase 8 RestClient 진입 시 사용. Stub profile 에서는 미사용.
    base-url: ${SERVER_B_URL:http://localhost:8082}
    connect-timeout-millis: 1000
    read-timeout-millis: 200    # ADR-001: A→B 호출 timeout
  rate-limit:
    user:
      # ADR-005: 사용자당 10 req/sec. burst 는 capacity = refill 로 평탄화.
      capacity: ${RATE_LIMIT_CAPACITY:10}
      refill-tokens: ${RATE_LIMIT_REFILL_TOKENS:10}
      refill-period-seconds: ${RATE_LIMIT_REFILL_SECONDS:1}
  idempotency:
    # ADR-004: Idempotency-Key 응답 캐시 TTL.
    ttl-hours: ${IDEMPOTENCY_TTL_HOURS:24}

# A→B 호출 보호 (CLAUDE.md ADR-001).
# read-timeout 200ms 는 RestClient HTTP 레벨 (Resilience4j TimeLimiter 미사용 — 동기 인터페이스 유지).
# Circuit Breaker 가 그 timeout 실패와 5xx 를 카운트해서 OPEN 결정.
resilience4j:
  circuitbreaker:
    instances:
      couponIssuing:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50          # 50% 실패 → OPEN
        slow-call-rate-threshold: 50
        slow-call-duration-threshold: 200ms # 200ms 초과 = slow
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
