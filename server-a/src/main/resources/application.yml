spring:
  application:
    name: server-a
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/server_a?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:promotion}
    password: ${DB_PASSWORD:promotion}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 1 vCPU 환경 보수적 설정. Day 4 k6 부하 테스트 결과에 따라 튜닝.
      maximum-pool-size: 10
      connection-timeout: 3000
      validation-timeout: 1000
  jpa:
    hibernate:
      # Flyway 가 스키마 진실 — JPA 는 검증만.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
